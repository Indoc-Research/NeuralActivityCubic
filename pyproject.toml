[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralactivitycubic"
dynamic = ["version"]
description = "Computation of local and signal-close-to-noise calcium activity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
authors = [{name = "Dennis Doll", email = "ddoll@indocresearch.org"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Science/Research", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['jupyterlab>=4.4.8', 'ipywidgets>=8.0.4', 'ipyfilechooser>=0.6.0', 'imageio>=2.31.4', 'imageio-ffmpeg>=0.4.9', 'matplotlib>=3.8.0', 'scipy>=1.15.3', 'numpy>=2.2.5', 'pandas>=2.2.1', 'pybaselines>=1.1.0', 'roifile>=2024.5.24', 'shapely>=2.0.1', 'scikit-image>=0.22.0', 'pynwb>=3.0.0', 'fastcore>=1.8.2']

[project.urls]
Repository = "https://github.com/Indoc-Research/NeuralActivityCubic"
Documentation = "https://indoc-research.github.io/NeuralActivityCubic"

[project.entry-points.nbdev]
neuralactivitycubic = "neuralactivitycubic._modidx:d"

[project.optional-dependencies]
dev = ['playwright>=1.53.0']

[tool.setuptools.dynamic]
version = {attr = "neuralactivitycubic.__version__"}

[tool.setuptools.packages.find]
include = ["neuralactivitycubic"]

[tool.nbdev]
custom_sidebar = true
title = 'neuralactivitycubic'
